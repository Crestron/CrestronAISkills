<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crestron AI Skills</title>
    <meta name="description" content="Browse, search, and install Crestron AI Skills." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23004a80'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #ffffff;
        --surface: #f5f7fa;
        --border: #dde3ea;
        --accent: #004a80;
        --accent-hover: #003a66;
        --link: #004a80;
        --text: #1d2330;
        --text-muted: #5b6573;
        --tag-bg: #eef2f6;
        --radius: 6px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body { background: var(--bg); color: var(--text); min-height: 100vh; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      /* Home feature tiles: always one row of 4 that shrinks; stack vertically on mobile. */
      .feature-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      @media (max-width: 640px) { .feature-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
