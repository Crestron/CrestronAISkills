name: Deploy Web UI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'registry.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/registry.json
          VITE_REPO_URL: https://github.com/${{ github.repository }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Copy registry to dist
        run: cp registry.json web/dist/registry.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Fail with helpful message if Pages not enabled
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          echo "::error::Go to https://github.com/${{ github.repository }}/settings/pages"
          echo "::error::Set Source to 'GitHub Actions', then re-run this workflow."
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
