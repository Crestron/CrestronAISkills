# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.STAGING_RUNS_ON || 'ubuntu-latest' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REGISTRY_URL: /${{ github.event.repository.name }}/registry.json
          VITE_REPO_URL: https://github.com/${{ github.repository }}
      # Installer/update scripts ship from web/public/scripts/ via the Vite build.
      - name: Generate registry.json from skills/
        run: npm run build:registry
        working-directory: web
      - name: Copy skills/ to dist (excluding deprecated skills)
        run: |
          mkdir -p web/dist/skills
          for dir in skills/*/; do
            # Deprecated is set in compliance.yaml (Agent Skills layout) or, for legacy skills, in skill.md.
            if grep -qE '^deprecated:[[:space:]]*true' "${dir}compliance.yaml" "${dir}skill.md" 2>/dev/null; then
              echo "Skipping deprecated skill: ${dir}"
              continue
            fi
            cp -r "${dir%/}" web/dist/skills/
            # Serve the main file under both names: new installers fetch SKILL.md, installers already on
            # users' machines fetch skill.md, and Pages is case-sensitive.
            out="web/dist/skills/$(basename "$dir")"
            if [ -f "$out/SKILL.md" ] && [ ! -e "$out/skill.md" ]; then cp "$out/SKILL.md" "$out/skill.md"; fi
            if [ -f "$out/skill.md" ] && [ ! -e "$out/SKILL.md" ]; then cp "$out/skill.md" "$out/SKILL.md"; fi
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload built Vite output
          path: 'web/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
