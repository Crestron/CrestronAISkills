# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_REGISTRY_URL: /${{ github.event.repository.name }}/registry.json
      - name: Generate registry.json from skills/
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const skillsDir = 'skills';
          const skills = [];
          if (fs.existsSync(skillsDir)) {
            for (const entry of fs.readdirSync(skillsDir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const mp = path.join(skillsDir, entry.name, 'skill.md');
              if (!fs.existsSync(mp)) continue;
              const content = fs.readFileSync(mp, 'utf8');
              const fmMatch = content.match(/^---\n([\s\S]*?)\n---/);
              if (!fmMatch) continue;
              const fm = fmMatch[1];
              const get = (key) => { const m = fm.match(new RegExp('^' + key + ':\\\\s*(.+)$', 'm')); return m ? m[1].trim() : ''; };
              const tagsMatch = fm.match(/^tags:\\s*\\[(.*)\\]/m);
              const tags = tagsMatch ? tagsMatch[1].split(',').map(t => t.trim()) : [];
              skills.push({ name: get('name'), version: get('version'), description: get('description'), tags, author: get('author'), path: skillsDir+'/'+entry.name, license: get('license')||'MIT', homepage: null });
            }
          }
          const registry = { version: '1', updatedAt: new Date().toISOString(), skills: skills.sort((a,b) => a.name.localeCompare(b.name)) };
          fs.writeFileSync('web/dist/registry.json', JSON.stringify(registry, null, 2) + '\n');
          console.log('Registry generated:', skills.length, 'skill(s)');
          "
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload built Vite output
          path: 'web/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
