name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'copilot-skills/**'

permissions:
  contents: write

jobs:
  validate:
    name: Validate against skill-schema.json
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Checkout PR head for skill files. No token passed here — the write token
      # is only used in the commit-back step via GITHUB_TOKEN env var.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      # Security: overwrite the validator/scanner scripts (and their inputs) with the
      # base-branch version so a PR that modifies them cannot run its own code with
      # write access. Each path is pinned individually and tolerantly — a path that
      # doesn't exist yet on the base branch (e.g. the PR introducing it for the
      # first time) is left as the PR's own copy for that one bootstrap PR only;
      # every subsequent PR pins against the now-merged base version.
      - name: Pin validator scripts to base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid BASE_REF"; exit 1; }
          git fetch origin "$BASE_REF" --depth=1
          for p in .github/scripts/validate-skill.js .github/scripts/scan-skill-security.js \
                   .github/scripts/lib skill-schema.json package.json package-lock.json \
                   .github/actions/changed-skill-dirs; do
            git cat-file -e "FETCH_HEAD:$p" 2>/dev/null && git checkout FETCH_HEAD -- "$p" || true
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find changed skill directories
        id: changed
        uses: ./.github/actions/changed-skill-dirs
        with:
          base-ref: ${{ github.base_ref }}

      # Deterministic install from the (now base-branch-pinned) lockfile, with
      # lifecycle scripts disabled — this job has contents: write and pushes back
      # to the PR branch, so a PR-controlled postinstall script must not be able
      # to run with that access.
      - name: Install validator dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Validate skills
        env:
          CHANGED_DIRS: ${{ steps.changed.outputs.dirs }}
          REPORTS_DIR: reports
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/validate-skill.js

      - name: Scan skills for safety/security issues
        env:
          CHANGED_DIRS: ${{ steps.changed.outputs.dirs }}
          REPORTS_DIR: reports
        run: node .github/scripts/scan-skill-security.js

      - name: Scan changed skill files for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.97.1
          extra_args: --only-verified

      - name: Commit validation reports
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid HEAD_REF"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add -- reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "ci: add validation reports [skip ci]"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi
