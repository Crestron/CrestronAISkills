name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'

jobs:
  validate:
    name: Validate Skill Manifest
    runs-on: Sabtain_crestron_ai_skills
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find changed skill directories
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'skills/**' | grep -oP 'skills/[^/]+' | sort -u)
          echo "dirs=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed skill dirs: $CHANGED"

      - name: Validate skill.md frontmatter
        run: |
          CHANGED_DIRS="${{ steps.changed.outputs.dirs }}"
          if [ -z "$CHANGED_DIRS" ]; then
            echo "No skill directories changed."
            exit 0
          fi

          has_errors=0

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            [ ! -d "$dir" ] && continue
            echo ""
            echo "Validating: $dir"

            skill_md="$dir/skill.md"
            if [ ! -f "$skill_md" ]; then
              echo "  ✗ Missing required file: skill.md"
              has_errors=1
              continue
            fi
            echo "  ✓ Found skill.md"

            # Extract frontmatter fields
            in_fm=0
            name_val=""
            version_val=""
            description_val=""
            tags_val=""
            author_val=""

            while IFS= read -r line; do
              if [ "$line" = "---" ] && [ "$in_fm" = "0" ]; then
                in_fm=1
                continue
              fi
              if [ "$line" = "---" ] && [ "$in_fm" = "1" ]; then
                break
              fi
              if [ "$in_fm" = "1" ]; then
                key=$(echo "$line" | grep -oP '^[a-z]+(?=:)')
                val=$(echo "$line" | sed 's/^[a-z]*: *//')
                case "$key" in
                  name)        name_val="$val" ;;
                  version)     version_val="$val" ;;
                  description) description_val="$val" ;;
                  tags)        tags_val="$val" ;;
                  author)      author_val="$val" ;;
                esac
              fi
            done < "$skill_md"

            # Check required fields
            for field_name in name version description tags author; do
              eval val=\$${field_name}_val
              if [ -z "$val" ]; then
                echo "  ✗ Missing required frontmatter field: $field_name"
                has_errors=1
              else
                echo "  ✓ $field_name: $val"
              fi
            done

            # Check directory name matches skill name
            dir_name=$(basename "$dir")
            if [ -n "$name_val" ] && [ "$name_val" != "$dir_name" ]; then
              echo "  ✗ skill name \"$name_val\" must match directory name \"$dir_name\""
              has_errors=1
            elif [ -n "$name_val" ]; then
              echo "  ✓ Skill name matches directory"
            fi

          done <<< "$CHANGED_DIRS"

          if [ "$has_errors" = "1" ]; then
            echo ""
            echo "❌ Validation failed. Please fix the errors above."
            exit 1
          else
            echo ""
            echo "✅ All skill validations passed!"
          fi
