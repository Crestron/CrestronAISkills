name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'

jobs:
  validate:
    name: Validate against skill-schema.json
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find changed skill directories
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'skills/**' \
            | grep -oP 'skills/[^/]+' | sort -u | tr '\n' ' ')
          echo "dirs=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed skill dirs: $CHANGED"

      - name: Validate skills
        env:
          CHANGED_DIRS: ${{ steps.changed.outputs.dirs }}
        run: node .github/scripts/validate-skill.js
