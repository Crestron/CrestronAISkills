name: Update Registry

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'

jobs:
  update-registry:
    name: Rebuild registry.json
    runs-on: Sabtain_crestron_ai_skills
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild registry.json
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const skillsDir = 'skills';
          const skills = [];

          function parseFrontmatter(content) {
            const lines = content.split('\n');
            const fm = {};
            let inFm = false;
            for (const line of lines) {
              if (line.trim() === '---' && !inFm) { inFm = true; continue; }
              if (line.trim() === '---' && inFm) { break; }
              if (inFm) {
                const m = line.match(/^(\w+):\s*(.*)$/);
                if (m) {
                  const key = m[1];
                  let val = m[2].trim();
                  if (/^\[/.test(val)) {
                    val = val.replace(/^\[|\]$/g, '').split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
                  } else {
                    val = val.replace(/^['"]|['"]$/g, '');
                  }
                  fm[key] = val;
                }
              }
            }
            return fm;
          }

          if (!fs.existsSync(skillsDir)) {
            console.log('No skills directory found.');
          } else {
            const entries = fs.readdirSync(skillsDir, { withFileTypes: true });
            for (const entry of entries) {
              if (!entry.isDirectory()) continue;
              const skillMdPath = path.join(skillsDir, entry.name, 'skill.md');
              if (!fs.existsSync(skillMdPath)) continue;

              const content = fs.readFileSync(skillMdPath, 'utf8');
              const fm = parseFrontmatter(content);
              skills.push({
                name: fm.name,
                version: fm.version,
                description: fm.description,
                tags: Array.isArray(fm.tags) ? fm.tags : [fm.tags],
                author: fm.author,
                path: `${skillsDir}/${entry.name}`,
                license: fm.license || 'MIT',
                homepage: fm.homepage || null,
              });
              console.log(`  + ${fm.name}@${fm.version}`);
            }
          }

          const registry = {
            version: '1',
            updatedAt: new Date().toISOString(),
            skills: skills.sort((a, b) => a.name.localeCompare(b.name)),
          };

          fs.writeFileSync('registry.json', JSON.stringify(registry, null, 2) + '\n');
          console.log(`\nRegistry updated: ${skills.length} skill(s)`);
          EOF

      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add registry.json
          if git diff --cached --quiet; then
            echo "No changes to registry.json"
          else
            git commit -m "chore: update registry.json [skip ci]"
            git push
          fi
