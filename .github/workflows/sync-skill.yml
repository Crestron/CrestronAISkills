name: Sync Skill From Source Repo

# Mirrors a skill from a team's own repo into skills/<target_name>/ and opens a
# PR here — never pushes to main directly. The resulting PR goes through the
# exact same validate-skill.yml/test-skill.yml/CODEOWNERS pipeline as any other
# skill PR. See CONTRIBUTING.md "Importing a Skill You Built in Another Repo".
#
# The sync/<target_name> branch is disposable and bot-owned: every run resets
# it to main's current tip before reapplying the synced skill, then
# force-pushes. There is nothing else on that branch worth preserving between
# runs, so this is simpler and safer than trying to merge/rebase it forward.
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repo, as "owner/repo"'
        required: true
      source_ref:
        description: 'Branch, tag, or commit SHA to sync from'
        required: true
      source_path:
        description: 'Path within the source repo to the skill directory'
        required: true
      target_name:
        description: 'Skill name in this repo (skills/<target_name>/). Defaults to the last segment of source_path.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync skill and open/update PR
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout CrestronAISkills
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Split "owner/repo" so the app-token step can request an installation
      # token scoped to exactly that org/repo — this is what lets one app
      # registration work across any number of source orgs with no
      # per-org secret or workflow change. See
      # docs/runbooks/github-app-setup.md.
      - name: Split source_repo into owner/repo
        id: source
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          [[ "$SOURCE_REPO" == */* ]] || { echo "source_repo must be 'owner/repo'"; exit 1; }
          echo "owner=${SOURCE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${SOURCE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Get installation token for the source org
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SKILL_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILL_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.repo }}

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: _source
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Compute target skill name and branch
        id: target
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_NAME_INPUT: ${{ inputs.target_name }}
        run: |
          if [ -n "$TARGET_NAME_INPUT" ]; then
            NAME="$TARGET_NAME_INPUT"
          else
            NAME=$(basename "$SOURCE_PATH")
          fi
          [[ "$NAME" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]] || { echo "target_name '$NAME' is not a valid skill name (lowercase, hyphens only)"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "branch=sync/$NAME" >> "$GITHUB_OUTPUT"

      # Reset the sync branch to main's current tip *before* the sync script
      # writes anything, so there's never a checkout-with-uncommitted-changes
      # conflict between this step and the one after it.
      - name: Reset sync branch to main
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" main

      - name: Run sync
        env:
          SOURCE_DIR: _source
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_NAME: ${{ steps.target.outputs.name }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node .github/scripts/sync-skill.js

      - name: Remove the source repo checkout before committing
        run: rm -rf _source

      - name: Commit and push
        id: commit
        env:
          TARGET_NAME: ${{ steps.target.outputs.name }}
          BRANCH: ${{ steps.target.outputs.branch }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          git add "skills/${TARGET_NAME}" "copilot-skills/${TARGET_NAME}"
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to sync — skills/${TARGET_NAME} already matches ${SOURCE_REPO}@${SOURCE_REF}."
            exit 0
          fi
          git commit -m "sync: update ${TARGET_NAME} from ${SOURCE_REPO}@${SOURCE_REF}"
          git push origin "$BRANCH" --force
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR if one doesn't already exist
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_NAME: ${{ steps.target.outputs.name }}
          BRANCH: ${{ steps.target.outputs.branch }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Pushed to existing PR #$EXISTING_PR"
            exit 0
          fi
          BODY=$(printf 'Mirrors `%s` from [`%s`](https://github.com/%s)@`%s`.\n\nIf this is a new skill, `validate-skill.yml` will list the Crestron-only compliance metadata (scope, test-strategy, approved-by, etc.) that still needs filling in before this can merge -- this is expected, not a bug. See CONTRIBUTING.md "Importing a Skill You Built in Another Repo".\n' "$TARGET_NAME" "$SOURCE_REPO" "$SOURCE_REPO" "$SOURCE_REF")
          gh pr create --base main --head "$BRANCH" --title "sync: import ${TARGET_NAME} from ${SOURCE_REPO}" --body "$BODY"
